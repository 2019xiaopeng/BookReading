[package]
name = "bookreading"
version = "3.1.3"
license = "MIT"
description = "A Tauri App"
authors = ["you"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "bookreading_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["tray-icon", "protocol-asset"] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.32", features = ["bundled"] }
uuid = { version = "1", features = ["v4", "serde"] }
time = { version = "0.3", features = ["serde", "local-offset"] }
windows-sys = { version = "0.59", features = ["Win32_UI_WindowsAndMessaging", "Win32_Storage_FileSystem"] }
zip = "2"
roxmltree = "0.20"
regex = "1"
encoding_rs = "0.8"
image = "0.25"
tauri-plugin-window-state = "2"
# v3.1 C-1：官方更新器插件（Rust 侧注册 + CI 签名产物；前端 UI 批次3 接）
tauri-plugin-updater = "2"
trash = "5"
# v2.7 应用内更新：GitHub Releases API + 安装包下载（阻塞客户端，跑在 async 命令的阻塞线程池）
reqwest = { version = "0.12", default-features = false, features = ["blocking", "default-tls"] }
hmac = "0.12"
sha2 = "0.10"
# U-15：直接引用 wry 已锁定的 WebView2 COM 绑定（版本必须与 Cargo.lock 单例一致，否则 controller() 类型对不上）
webview2-com = "0.39"
windows = "0.62"

# U-21 安装包瘦身：strip 符号 + 全链接期优化 + 最小体积优先（构建时间换体积）
[profile.release]
strip = true
lto = true
codegen-units = 1
opt-level = "s"

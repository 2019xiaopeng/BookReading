name: windows-installers

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: windows-installers-${{ github.ref }}
      cancel-in-progress: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows packaging tools
        run: choco install -y nsis wixtoolset

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run tauri build

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="artifacts/windows"
          rm -rf artifacts
          mkdir -p "$OUT_DIR"

          COUNT="$(find "src-tauri/target/release/bundle" -type f \( -name "*.msi" -o -name "*.exe" \) | wc -l | tr -d ' ')"
          if [ "$COUNT" = "0" ]; then
            echo "No .msi/.exe found under src-tauri/target/release/bundle"
            find "src-tauri/target/release/bundle" -maxdepth 6 -type f || true
            exit 1
          fi

          RAW_DIR="$OUT_DIR/raw"
          mkdir -p "$RAW_DIR"
          find "src-tauri/target/release/bundle" -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} "$RAW_DIR/" \;

          ZIP_PATH="$OUT_DIR/bookreading_${GITHUB_SHA}_windows.zip"
          powershell -NoProfile -Command "Compress-Archive -Path '${RAW_DIR}\\*' -DestinationPath '${ZIP_PATH}' -Force"

          powershell -NoProfile -Command "
            \$zip = '${ZIP_PATH}';
            \$max = 95MB;
            \$chunk = 90MB;
            \$fi = Get-Item \$zip;
            if (\$fi.Length -le \$max) { exit 0 }
            \$in = [System.IO.File]::OpenRead(\$zip);
            try {
              \$idx = 0;
              \$buf = New-Object byte[] (1MB);
              while (\$true) {
                \$outPath = \"\$zip.part\$('{0:D3}' -f \$idx)\";
                \$out = [System.IO.File]::Create(\$outPath);
                try {
                  \$written = 0;
                  while (\$written -lt \$chunk) {
                    \$need = [Math]::Min(\$buf.Length, \$chunk - \$written);
                    \$read = \$in.Read(\$buf, 0, \$need);
                    if (\$read -le 0) { break }
                    \$out.Write(\$buf, 0, \$read);
                    \$written += \$read;
                  }
                } finally {
                  \$out.Dispose();
                }
                if (\$in.Position -ge \$in.Length) { break }
                \$idx += 1;
              }
            } finally {
              \$in.Dispose();
            }
            Remove-Item -Force \$zip
          "

          rm -rf "$RAW_DIR"

          echo "${GITHUB_SHA}" > "$OUT_DIR/commit.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/windows/*
          if-no-files-found: error

      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          tag_name: windows-latest
          name: Windows Latest
          prerelease: true
          generate_release_notes: false
          files: |
            artifacts/windows/*

      - name: Publish installers to artifacts branch
        shell: bash
        run: |
          set -euo pipefail
          ART_BRANCH="artifacts/windows-installers"
          OUT_DIR="artifacts/windows"
          TMP_DIR="${RUNNER_TEMP:-/tmp}/bookreading-windows-installers"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          cp "$OUT_DIR"/* "$TMP_DIR"/

          git reset --hard
          git clean -fdx

          git switch --orphan "$ART_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$OUT_DIR"
          cp "$TMP_DIR"/* "$OUT_DIR"/
          git add "$OUT_DIR"
          git commit -m "chore: publish windows installers (${GITHUB_SHA})" || true
          git push -f origin "HEAD:$ART_BRANCH"

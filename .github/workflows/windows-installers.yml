name: windows-installers

on:
  push:
    branches:
      - main
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    concurrency:
      group: windows-installers-${{ github.ref }}
      cancel-in-progress: true
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Install Windows packaging tools
        run: choco install -y nsis wixtoolset

      - name: Install dependencies
        run: npm ci

      - name: Build Windows installers
        run: npm run tauri build

      - name: Collect installers
        shell: bash
        run: |
          set -euo pipefail
          OUT_DIR="artifacts/windows"
          rm -rf artifacts
          mkdir -p "$OUT_DIR"

          COUNT="$(find "src-tauri/target/release/bundle" -type f \( -name "*.msi" -o -name "*.exe" \) | wc -l | tr -d ' ')"
          if [ "$COUNT" = "0" ]; then
            echo "No .msi/.exe found under src-tauri/target/release/bundle"
            find "src-tauri/target/release/bundle" -maxdepth 6 -type f || true
            exit 1
          fi

          find "src-tauri/target/release/bundle" -type f \( -name "*.msi" -o -name "*.exe" \) -exec cp {} "$OUT_DIR/" \;
          echo "${GITHUB_SHA}" > "$OUT_DIR/commit.txt"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installers
          path: artifacts/windows/*
          if-no-files-found: error

      - name: Publish installers to artifacts branch
        shell: bash
        run: |
          set -euo pipefail
          ART_BRANCH="artifacts/windows-installers"
          OUT_DIR="artifacts/windows"
          TMP_DIR="${RUNNER_TEMP:-/tmp}/bookreading-windows-installers"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config --global --add safe.directory "${GITHUB_WORKSPACE}"

          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"

          rm -rf "$TMP_DIR"
          mkdir -p "$TMP_DIR"
          cp "$OUT_DIR"/* "$TMP_DIR"/

          git reset --hard
          git clean -fdx

          git switch --orphan "$ART_BRANCH"
          git rm -rf . >/dev/null 2>&1 || true
          mkdir -p "$OUT_DIR"
          cp "$TMP_DIR"/* "$OUT_DIR"/
          git add "$OUT_DIR"
          git commit -m "chore: publish windows installers (${GITHUB_SHA})" || true
          git push -f origin "HEAD:$ART_BRANCH"

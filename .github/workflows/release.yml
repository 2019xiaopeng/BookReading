name: release

# v2.7.0：tag 推送 → 云端 Windows 构建 NSIS → 自动挂到 GitHub Release
# 本地零磁盘占用；发布流程 = git tag vRust.X && git push origin vX.Y.Z
on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install frontend deps
        run: npm ci

      - name: Run tests
        run: npm test

      - name: Build NSIS installer (updater-signed)
        run: npm run tauri build
        env:
          # GitHub Actions 的 runner 直连 GitHub 无需镜像；CSP/其余配置与本地一致
          CARGO_INCREMENTAL: "0"
          # C-1 更新器签名：tauri.conf createUpdaterArtifacts=true 时 NSIS 自动产 <setup>.exe.sig
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

      - name: Generate updater manifest (latest.json)
        shell: bash
        run: |
          set -euo pipefail
          NSIS_DIR="src-tauri/target/release/bundle/nsis"
          SETUP="$(find "$NSIS_DIR" -name 'bookreading_*_x64-setup.exe' | head -n1)"
          SIG="${SETUP}.sig"
          test -n "$SETUP" || { echo "setup.exe not found under $NSIS_DIR"; exit 1; }
          test -f "$SIG" || { echo "updater signature missing: $SIG"; exit 1; }
          VERSION="${GITHUB_REF_NAME#v}"
          export SIG_FILE="$SIG" VERSION ASSET_URL="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}/$(basename "$SETUP")"
          # tauri-plugin-updater v2 清单：signature=.sig 全文（minisign 注释行+签名），url=本 release 直链
          node -e '
            const fs = require("fs");
            const manifest = {
              version: process.env.VERSION,
              notes: `BookReading ${process.env.VERSION}`,
              pub_date: new Date().toISOString(),
              platforms: {
                "windows-x86_64": {
                  signature: fs.readFileSync(process.env.SIG_FILE, "utf8").trim(),
                  url: process.env.ASSET_URL,
                },
              },
            };
            fs.writeFileSync("latest.json", JSON.stringify(manifest, null, 2) + "\n");
          '
          cat latest.json

      - name: Upload installer to release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/release/bundle/nsis/bookreading_*_x64-setup.exe
            src-tauri/target/release/bundle/nsis/bookreading_*_x64-setup.exe.sig
            latest.json
          generate_release_notes: false

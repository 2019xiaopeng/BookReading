<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>安卓阅读器原型</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@500;700&family=Inter:wght@400;500;600&display=swap" rel="stylesheet" />
    <script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
    <script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
    <style>
      :root {
        --paper: #f7f3ed;
        --ink: #121316;
        --muted: rgba(18, 19, 22, 0.68);
        --hairline: rgba(18, 19, 22, 0.12);
        --card: rgba(255, 255, 255, 0.72);
        --card-strong: rgba(255, 255, 255, 0.92);
        --accent: #c04a1a;
        --accent-2: #0e6f5c;
        --shadow: 0 12px 34px rgba(0, 0, 0, 0.14);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        height: 100%;
        width: 100%;
      }

      body {
        margin: 0;
        color: var(--ink);
        background: radial-gradient(1200px 900px at 15% 15%, rgba(192, 74, 26, 0.14), transparent 55%),
          radial-gradient(900px 700px at 82% 28%, rgba(14, 111, 92, 0.12), transparent 55%),
          radial-gradient(900px 900px at 55% 92%, rgba(0, 0, 0, 0.06), transparent 52%),
          var(--paper);
        font-family: Inter, system-ui, -apple-system, Segoe UI, Roboto, Helvetica, Arial, "Apple Color Emoji", "Segoe UI Emoji";
      }

      #root {
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 44px 18px;
      }

      ::selection {
        background: rgba(192, 74, 26, 0.22);
      }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="text/babel">
      const { useEffect, useMemo, useRef, useState } = React;

      const androidFrameStyles = {
        wrapper: {
          display: "inline-block",
          padding: 10,
          background: "#1a1a1a",
          borderRadius: 44,
          boxShadow: "0 0 0 2px #2a2a2a, 0 20px 60px rgba(0,0,0,0.3)",
          position: "relative",
        },
        screen: {
          position: "relative",
          borderRadius: 36,
          overflow: "hidden",
          background: "#fff",
        },
        statusBar: {
          position: "absolute",
          top: 0,
          left: 0,
          right: 0,
          height: 32,
          display: "flex",
          alignItems: "center",
          justifyContent: "space-between",
          padding: "0 24px",
          fontSize: 14,
          fontWeight: 500,
          fontFamily: "Roboto, system-ui, -apple-system, sans-serif",
          zIndex: 20,
          pointerEvents: "none",
        },
        punchHole: {
          position: "absolute",
          top: 10,
          left: "50%",
          transform: "translateX(-50%)",
          width: 14,
          height: 14,
          background: "#000",
          borderRadius: "50%",
          zIndex: 30,
        },
        statusIcons: {
          display: "flex",
          alignItems: "center",
          gap: 6,
        },
        batteryText: {
          fontSize: 11,
          fontWeight: 600,
          marginLeft: 2,
        },
        content: {
          position: "absolute",
          top: 32,
          left: 0,
          right: 0,
          bottom: 24,
          overflow: "auto",
        },
        navBar: {
          position: "absolute",
          bottom: 0,
          left: 0,
          right: 0,
          height: 24,
          display: "flex",
          alignItems: "center",
          justifyContent: "center",
          gap: 60,
          zIndex: 10,
        },
        navButton: {
          width: 36,
          height: 4,
          background: "rgba(0,0,0,0.3)",
          borderRadius: 999,
        },
      };

      function AndroidFrame({
        children,
        width = 412,
        height = 892,
        time = "9:41",
        battery = 88,
        darkMode = false,
        navStyle = "gesture",
      }) {
        const textColor = darkMode ? "#fff" : "#1a1a1a";

        return (
          <div style={androidFrameStyles.wrapper}>
            <div
              style={{
                ...androidFrameStyles.screen,
                width,
                height,
                background: darkMode ? "#000" : "#fff",
              }}
            >
              <div style={{ ...androidFrameStyles.statusBar, color: textColor }}>
                <span>{time}</span>
                <div style={androidFrameStyles.statusIcons}>
                  <svg width="14" height="10" viewBox="0 0 14 10" fill="currentColor">
                    <rect x="0" y="6" width="2" height="4" rx="0.5" />
                    <rect x="4" y="4" width="2" height="6" rx="0.5" />
                    <rect x="8" y="2" width="2" height="8" rx="0.5" />
                    <rect x="12" y="0" width="2" height="10" rx="0.5" />
                  </svg>
                  <svg width="14" height="10" viewBox="0 0 14 10" fill="none">
                    <path d="M7 9a1 1 0 100-2 1 1 0 000 2z" fill="currentColor" />
                    <path d="M3 6a5 5 0 018 0" stroke="currentColor" strokeWidth="1.2" />
                    <path d="M0.5 3.5a11 11 0 0113 0" stroke="currentColor" strokeWidth="1.2" opacity="0.6" />
                  </svg>
                  <div
                    style={{
                      width: 22,
                      height: 10,
                      border: "1.5px solid currentColor",
                      borderRadius: 2,
                      padding: 1,
                      position: "relative",
                    }}
                  >
                    <div
                      style={{
                        width: `${battery}%`,
                        height: "100%",
                        background: "currentColor",
                        borderRadius: 1,
                      }}
                    />
                  </div>
                  <span style={androidFrameStyles.batteryText}>{battery}%</span>
                </div>
              </div>

              <div style={androidFrameStyles.punchHole} />

              <div style={androidFrameStyles.content}>{children}</div>

              {navStyle === "gesture" && (
                <div style={androidFrameStyles.navBar}>
                  <div
                    style={{
                      ...androidFrameStyles.navButton,
                      width: 100,
                      height: 4,
                      background: darkMode ? "rgba(255,255,255,0.5)" : "rgba(0,0,0,0.4)",
                    }}
                  />
                </div>
              )}

              {navStyle === "buttons" && (
                <div style={androidFrameStyles.navBar}>
                  <span style={{ color: textColor, fontSize: 20 }}>◁</span>
                  <span style={{ color: textColor, fontSize: 16 }}>○</span>
                  <span style={{ color: textColor, fontSize: 16 }}>□</span>
                </div>
              )}
            </div>
          </div>
        );
      }

      function clamp(n, min, max) {
        return Math.max(min, Math.min(max, n));
      }

      function useNowTime() {
        const [time, setTime] = useState(() => {
          const d = new Date();
          const hh = String(d.getHours()).padStart(2, "0");
          const mm = String(d.getMinutes()).padStart(2, "0");
          return `${hh}:${mm}`;
        });

        useEffect(() => {
          const t = window.setInterval(() => {
            const d = new Date();
            const hh = String(d.getHours()).padStart(2, "0");
            const mm = String(d.getMinutes()).padStart(2, "0");
            setTime(`${hh}:${mm}`);
          }, 15_000);
          return () => window.clearInterval(t);
        }, []);

        return time;
      }

      function fmtPercent(n) {
        return `${Math.round(clamp(n, 0, 1) * 100)}%`;
      }

      function Pill({ label, tone = "neutral" }) {
        const stylesByTone = {
          neutral: { background: "rgba(18,19,22,0.06)", color: "rgba(18,19,22,0.75)" },
          accent: { background: "rgba(192,74,26,0.12)", color: "rgba(192,74,26,0.95)" },
          ok: { background: "rgba(14,111,92,0.12)", color: "rgba(14,111,92,0.95)" },
        };
        const s = stylesByTone[tone] || stylesByTone.neutral;
        return (
          <span
            style={{
              display: "inline-flex",
              alignItems: "center",
              height: 24,
              padding: "0 10px",
              borderRadius: 999,
              fontSize: 12,
              fontWeight: 600,
              letterSpacing: "0.01em",
              ...s,
            }}
          >
            {label}
          </span>
        );
      }

      function IconButton({ label, onClick, children }) {
        return (
          <button
            onClick={onClick}
            aria-label={label}
            style={{
              height: 36,
              width: 36,
              display: "grid",
              placeItems: "center",
              borderRadius: 12,
              border: "1px solid rgba(18,19,22,0.10)",
              background: "rgba(255,255,255,0.75)",
              backdropFilter: "blur(10px)",
              cursor: "pointer",
              color: "rgba(18,19,22,0.86)",
              boxShadow: "0 10px 26px rgba(0,0,0,0.08)",
            }}
          >
            {children}
          </button>
        );
      }

      function PrimaryButton({ label, onClick }) {
        return (
          <button
            onClick={onClick}
            style={{
              height: 44,
              padding: "0 16px",
              borderRadius: 14,
              border: "1px solid rgba(192,74,26,0.25)",
              background: "linear-gradient(180deg, rgba(192,74,26,0.92), rgba(192,74,26,0.78))",
              color: "white",
              fontSize: 14,
              fontWeight: 700,
              letterSpacing: "0.01em",
              cursor: "pointer",
              boxShadow: "0 16px 40px rgba(192,74,26,0.22)",
            }}
          >
            {label}
          </button>
        );
      }

      function GhostButton({ label, onClick }) {
        return (
          <button
            onClick={onClick}
            style={{
              height: 44,
              padding: "0 14px",
              borderRadius: 14,
              border: "1px solid rgba(18,19,22,0.12)",
              background: "rgba(255,255,255,0.76)",
              color: "rgba(18,19,22,0.86)",
              fontSize: 14,
              fontWeight: 700,
              cursor: "pointer",
              boxShadow: "0 10px 28px rgba(0,0,0,0.08)",
            }}
          >
            {label}
          </button>
        );
      }

      function Sheet({ open, title, subtitle, onClose, children }) {
        return (
          <div
            style={{
              position: "absolute",
              inset: 0,
              pointerEvents: open ? "auto" : "none",
              zIndex: 80,
            }}
          >
            <div
              onClick={onClose}
              style={{
                position: "absolute",
                inset: 0,
                background: open ? "rgba(0,0,0,0.35)" : "rgba(0,0,0,0)",
                transition: "background 180ms ease",
              }}
            />
            <div
              style={{
                position: "absolute",
                left: 0,
                right: 0,
                bottom: 0,
                transform: open ? "translateY(0)" : "translateY(22px)",
                opacity: open ? 1 : 0,
                transition: "transform 220ms ease, opacity 220ms ease",
                padding: 14,
              }}
            >
              <div
                style={{
                  background: "rgba(255,255,255,0.92)",
                  border: "1px solid rgba(18,19,22,0.10)",
                  borderRadius: 20,
                  boxShadow: "0 24px 70px rgba(0,0,0,0.26)",
                  overflow: "hidden",
                }}
              >
                <div style={{ padding: "14px 16px 10px 16px", borderBottom: "1px solid rgba(18,19,22,0.08)" }}>
                  <div style={{ fontSize: 14, fontWeight: 800, letterSpacing: "0.01em" }}>{title}</div>
                  {subtitle ? (
                    <div style={{ marginTop: 4, fontSize: 12, color: "rgba(18,19,22,0.62)", lineHeight: 1.35 }}>{subtitle}</div>
                  ) : null}
                </div>
                <div style={{ padding: 16 }}>{children}</div>
              </div>
            </div>
          </div>
        );
      }

      function Segmented({ value, options, onChange }) {
        return (
          <div
            style={{
              display: "flex",
              padding: 4,
              borderRadius: 14,
              border: "1px solid rgba(18,19,22,0.10)",
              background: "rgba(18,19,22,0.04)",
              gap: 6,
            }}
          >
            {options.map((opt) => {
              const active = opt.value === value;
              return (
                <button
                  key={opt.value}
                  onClick={() => onChange(opt.value)}
                  style={{
                    flex: 1,
                    height: 34,
                    borderRadius: 12,
                    border: "1px solid rgba(18,19,22,0.06)",
                    background: active ? "rgba(255,255,255,0.85)" : "transparent",
                    cursor: "pointer",
                    fontSize: 13,
                    fontWeight: 700,
                    color: active ? "rgba(18,19,22,0.92)" : "rgba(18,19,22,0.58)",
                    boxShadow: active ? "0 10px 22px rgba(0,0,0,0.08)" : "none",
                  }}
                >
                  {opt.label}
                </button>
              );
            })}
          </div>
        );
      }

      function SliderRow({ label, value, min, max, step, formatValue, onChange }) {
        return (
          <div style={{ display: "grid", gridTemplateColumns: "1fr auto", gap: 10, alignItems: "center" }}>
            <div style={{ display: "grid", gap: 6 }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: "rgba(18,19,22,0.80)" }}>{label}</div>
              <input
                type="range"
                min={min}
                max={max}
                step={step}
                value={value}
                onChange={(e) => onChange(Number(e.target.value))}
                style={{ width: "100%" }}
              />
            </div>
            <div style={{ fontSize: 12, fontWeight: 800, color: "rgba(18,19,22,0.68)" }}>
              {formatValue ? formatValue(value) : value}
            </div>
          </div>
        );
      }

      function BookCover({ tone = "burnt", title, subtitle }) {
        const palette = {
          burnt: {
            bg: "linear-gradient(180deg, rgba(192,74,26,0.92), rgba(18,19,22,0.92))",
            ink: "rgba(255,255,255,0.92)",
            line: "rgba(255,255,255,0.24)",
          },
          moss: {
            bg: "linear-gradient(180deg, rgba(14,111,92,0.92), rgba(18,19,22,0.90))",
            ink: "rgba(255,255,255,0.92)",
            line: "rgba(255,255,255,0.22)",
          },
          stone: {
            bg: "linear-gradient(180deg, rgba(18,19,22,0.80), rgba(18,19,22,0.95))",
            ink: "rgba(255,255,255,0.92)",
            line: "rgba(255,255,255,0.18)",
          },
          paper: {
            bg: "linear-gradient(180deg, rgba(255,255,255,0.92), rgba(255,255,255,0.65))",
            ink: "rgba(18,19,22,0.88)",
            line: "rgba(18,19,22,0.14)",
          },
        };
        const p = palette[tone] || palette.burnt;
        return (
          <div
            style={{
              height: 112,
              borderRadius: 18,
              background: p.bg,
              padding: 12,
              border: "1px solid rgba(255,255,255,0.18)",
              boxShadow: "0 16px 44px rgba(0,0,0,0.16)",
              display: "grid",
              alignContent: "space-between",
              overflow: "hidden",
              position: "relative",
            }}
          >
            <div
              style={{
                position: "absolute",
                inset: -60,
                background:
                  "radial-gradient(420px 240px at 20% 30%, rgba(255,255,255,0.14), transparent 56%), radial-gradient(460px 340px at 80% 70%, rgba(255,255,255,0.08), transparent 60%)",
                transform: "rotate(-8deg)",
              }}
            />
            <div style={{ position: "relative", display: "grid", gap: 8 }}>
              <div style={{ height: 2, width: 34, borderRadius: 99, background: p.line }} />
              <div style={{ fontFamily: '"Noto Serif SC", serif', fontWeight: 700, fontSize: 14, lineHeight: 1.25, color: p.ink }}>
                {title}
              </div>
            </div>
            <div style={{ position: "relative", fontSize: 12, color: p.ink, opacity: 0.76, fontWeight: 600 }}>{subtitle}</div>
          </div>
        );
      }

      function TopBar({ title, subtitle, left, right }) {
        return (
          <div
            style={{
              position: "sticky",
              top: 0,
              zIndex: 40,
              padding: "14px 14px 10px 14px",
              background: "linear-gradient(180deg, rgba(247,243,237,0.96), rgba(247,243,237,0.72), rgba(247,243,237,0))",
              backdropFilter: "blur(10px)",
            }}
          >
            <div style={{ display: "grid", gridTemplateColumns: "40px 1fr 40px", gap: 10, alignItems: "center" }}>
              <div>{left}</div>
              <div style={{ display: "grid", gap: 2 }}>
                <div style={{ fontFamily: '"Noto Serif SC", serif', fontWeight: 700, fontSize: 15, letterSpacing: "0.01em" }}>
                  {title}
                </div>
                {subtitle ? <div style={{ fontSize: 12, color: "rgba(18,19,22,0.62)", fontWeight: 600 }}>{subtitle}</div> : null}
              </div>
              <div style={{ justifySelf: "end" }}>{right}</div>
            </div>
          </div>
        );
      }

      function BottomToast({ show, text }) {
        return (
          <div
            style={{
              position: "absolute",
              left: 14,
              right: 14,
              bottom: 18,
              transform: show ? "translateY(0)" : "translateY(14px)",
              opacity: show ? 1 : 0,
              transition: "transform 200ms ease, opacity 200ms ease",
              pointerEvents: "none",
              zIndex: 90,
            }}
          >
            <div
              style={{
                background: "rgba(18,19,22,0.86)",
                color: "rgba(255,255,255,0.92)",
                borderRadius: 16,
                padding: "12px 14px",
                fontSize: 12,
                fontWeight: 650,
                letterSpacing: "0.01em",
                boxShadow: "0 18px 50px rgba(0,0,0,0.28)",
              }}
            >
              {text}
            </div>
          </div>
        );
      }

      function HintPill({ show, text, dark }) {
        return (
          <div
            style={{
              position: "absolute",
              left: 0,
              right: 0,
              bottom: 22,
              display: "flex",
              justifyContent: "center",
              pointerEvents: "none",
              zIndex: 60,
              opacity: show ? 1 : 0,
              transform: show ? "translateY(0)" : "translateY(10px)",
              transition: "transform 200ms ease, opacity 200ms ease",
            }}
          >
            <div
              style={{
                maxWidth: 280,
                padding: "10px 12px",
                borderRadius: 999,
                background: dark ? "rgba(0,0,0,0.55)" : "rgba(255,255,255,0.74)",
                border: dark ? "1px solid rgba(255,255,255,0.10)" : "1px solid rgba(18,19,22,0.10)",
                color: dark ? "rgba(255,255,255,0.92)" : "rgba(18,19,22,0.86)",
                fontSize: 12,
                fontWeight: 800,
                letterSpacing: "0.01em",
                backdropFilter: "blur(10px)",
                boxShadow: dark ? "0 18px 55px rgba(0,0,0,0.30)" : "0 18px 55px rgba(0,0,0,0.12)",
                textAlign: "center",
              }}
            >
              {text}
            </div>
          </div>
        );
      }

      function ProgressPill({ progress }) {
        return (
          <div style={{ display: "grid", gap: 8 }}>
            <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
              <div style={{ fontSize: 12, fontWeight: 800, color: "rgba(18,19,22,0.80)" }}>预处理</div>
              <div style={{ fontSize: 12, fontWeight: 800, color: "rgba(18,19,22,0.56)" }}>{Math.round(progress * 100)}%</div>
            </div>
            <div style={{ height: 10, borderRadius: 999, border: "1px solid rgba(18,19,22,0.10)", background: "rgba(255,255,255,0.65)", overflow: "hidden" }}>
              <div
                style={{
                  height: "100%",
                  width: `${Math.round(progress * 100)}%`,
                  background: "linear-gradient(90deg, rgba(192,74,26,0.90), rgba(14,111,92,0.90))",
                  borderRadius: 999,
                  transition: "width 240ms ease",
                }}
              />
            </div>
          </div>
        );
      }

      function ReadingCanvas({ mode, theme, fullBleed = false, onTapLeft, onTapCenter, onTapRight, children }) {
        const bg =
          theme === "paper"
            ? "linear-gradient(180deg, rgba(255,255,255,0.9), rgba(255,255,255,0.68))"
            : theme === "night"
              ? "linear-gradient(180deg, rgba(15,16,18,0.98), rgba(15,16,18,0.92))"
              : "linear-gradient(180deg, rgba(249,246,241,0.96), rgba(249,246,241,0.78))";
        const ink = theme === "night" ? "rgba(255,255,255,0.92)" : "rgba(18,19,22,0.92)";
        const contentPadding = mode === "pdf" ? 0 : fullBleed ? 0 : 18;

        return (
          <div
            style={{
              position: "relative",
              height: "100%",
              borderRadius: fullBleed ? 0 : 18,
              background: bg,
              border: fullBleed ? "none" : "1px solid rgba(18,19,22,0.10)",
              boxShadow: fullBleed ? "none" : "0 18px 55px rgba(0,0,0,0.14)",
              overflow: "hidden",
            }}
          >
            <div
              style={{
                padding: contentPadding,
                color: ink,
                height: fullBleed ? "100%" : "auto",
                minHeight: fullBleed ? "100%" : 540,
              }}
            >
              {children}
            </div>
            <button
              onClick={onTapLeft}
              style={{
                position: "absolute",
                inset: 0,
                width: "30%",
                border: "none",
                background: "transparent",
                cursor: "pointer",
              }}
            />
            <button
              onClick={onTapRight}
              style={{
                position: "absolute",
                inset: 0,
                left: "70%",
                width: "30%",
                border: "none",
                background: "transparent",
                cursor: "pointer",
              }}
            />
            <button
              onClick={onTapCenter}
              style={{
                position: "absolute",
                inset: 0,
                left: "30%",
                width: "40%",
                border: "none",
                background: "transparent",
                cursor: "pointer",
              }}
            />
          </div>
        );
      }

      function App() {
        const time = useNowTime();

        const [route, setRoute] = useState({ name: "shelf" });
        const [toast, setToast] = useState(null);
        const [sheet, setSheet] = useState(null);
        const [filter, setFilter] = useState("all");
        const [hudVisible, setHudVisible] = useState(false);
        const hudTimerRef = useRef(null);
        const [pageHint, setPageHint] = useState(null);
        const pageHintTimerRef = useRef(null);

        const [readingPrefs, setReadingPrefs] = useState({
          theme: "paper",
          fontSize: 17,
          lineHeight: 1.7,
          margin: 18,
        });

        const [readerPrefs, setReaderPrefs] = useState({

          setToast(text);
          window.setTimeout(() => setToast(null), 1800);

        function flashHint(text) {
          setPageHint(text);
          window.clearTimeout(pageHintTimerRef.current);
          pageHintTimerRef.current = window.setTimeout(() => setPageHint(null), 1100);
        }

        function hideHUD() {
          window.clearTimeout(hudTimerRef.current);
          hudTimerRef.current = null;
          setHudVisible(false);
        }

        function showHUD(autoHide = false) {
          window.clearTimeout(hudTimerRef.current);
          hudTimerRef.current = null;
          setHudVisible(true);
          if (autoHide) {
            hudTimerRef.current = window.setTimeout(() => setHudVisible(false), 2600);
          }
        }

        function getActiveLocator() {
          if (!activeBook) return null;
          if (route.name === "pdfReader") return { type: "pdf", page: pdfLoc.page, segment: pdfLoc.segment };
          if (route.name === "epubReader") return { type: "epub", chapter: epubLoc.chapter };
          if (route.name === "textReader") return { type: "text", page: textLoc.page };
          return null;
        }

        function formatLocator(locator) {
          if (!locator) return "";
          if (locator.type === "pdf") return `第 ${locator.page} 页 · 段 ${locator.segment}`;
          if (locator.type === "epub") return `第 ${locator.chapter} 章`;
          if (locator.type === "text") return `第 ${locator.page} 页`;
          return "";
        }

        function isCurrentBookmarked() {
          if (!activeBook) return false;
          const loc = getActiveLocator();
          if (!loc) return false;
          return bookmarks.some((b) => b.bookId === activeBook.id && JSON.stringify(b.locator) === JSON.stringify(loc));
        }

        function toggleBookmark() {
          if (!activeBook) return;
          const loc = getActiveLocator();
          if (!loc) return;
          const exists = bookmarks.some((b) => b.bookId === activeBook.id && JSON.stringify(b.locator) === JSON.stringify(loc));
          if (exists) {
            setBookmarks((prev) => prev.filter((b) => !(b.bookId === activeBook.id && JSON.stringify(b.locator) === JSON.stringify(loc))));
            showToast("已移除书签");
            return;
          }
          setBookmarks((prev) => [
            {
              id: `bm_${Date.now()}`,
              bookId: activeBook.id,
              locator: loc,
              label: formatLocator(loc),
              createdAt: Date.now(),
            },
            ...prev,
          ]);
          showToast("已添加书签");
        }

        function openReaderMenu() {
          if (!activeBook) return;
          showHUD(false);
          setSheet("readerMenu");
        }

        function openHighlight() {
          if (!activeBook) return;
          showHUD(false);
          setHighlightDraft({ color: "amber", note: "" });
          setSheet("highlight");
        }

        function saveHighlight() {
          if (!activeBook) return;
          const loc = getActiveLocator();
          if (!loc) return;
          const sampleText =
            activeBook.format === "PDF"
              ? "（PDF 子页）选中区域的文本层可能缺失，此处可存截图或坐标。"
              : "「夜里下雨时，城市像被抛光过的石头。」";
          setAnnotations((prev) => [
            {
              id: `hl_${Date.now()}`,
              bookId: activeBook.id,
              locator: loc,
              color: highlightDraft.color,
              text: sampleText,
              note: highlightDraft.note,
              createdAt: Date.now(),
            },
            ...prev,
          ]);
          showToast("已保存标注");
          setSheet(null);
        }

        function openSearch() {
          if (!activeBook) return;
          if (activeBook.format === "PDF") {
            showToast("PDF 搜索依赖文本层（原型略）");
            return;
          }
          showHUD(false);
          setSearchDraft({ query: "" });
          setRoute({ name: "search", bookId: activeBook.id, returnTo: route });
        }

        function openBookmarks() {
          if (!activeBook) return;
          showHUD(false);
          setRoute({ name: "bookmarks", bookId: activeBook.id, returnTo: route });
        }

        function openAnnotations() {
          if (!activeBook) return;
          showHUD(false);
          setRoute({ name: "annotations", bookId: activeBook.id, returnTo: route });
        }

        function openProgress() {
          if (!activeBook) return;
          const loc = getActiveLocator();
          if (!loc) return;
          if (loc.type === "pdf") setProgressDraft({ value: (loc.page - 1) * pdfLoc.segmentsInPage + loc.segment });
          if (loc.type === "epub") setProgressDraft({ value: loc.chapter });
          if (loc.type === "text") setProgressDraft({ value: loc.page });
          showHUD(false);
          setSheet("progress");
        }

        function jumpProgress() {
          if (!activeBook) return;
          const v = progressDraft.value;
          if (route.name === "pdfReader") {
            const perPage = pdfLoc.segmentsInPage || 6;
            const nextPage = Math.max(1, Math.ceil(v / perPage));
            const nextSeg = Math.max(1, v - (nextPage - 1) * perPage);
            setPdfLoc((p) => ({ ...p, page: nextPage, segment: nextSeg }));
            updateProgress(activeBook.id, clamp(v / (pdfLoc.totalSegments || 1240), 0, 1));
          }
          if (route.name === "epubReader") {
            const c = clamp(v, 1, epubLoc.chapters);
            setEpubLoc((p) => ({ ...p, chapter: c, percent: clamp(c / p.chapters, 0, 1) }));
            updateProgress(activeBook.id, clamp(c / epubLoc.chapters, 0, 1));
          }
          if (route.name === "textReader") {
            const p = clamp(v, 1, textLoc.totalPages);
            setTextLoc((prev) => ({ ...prev, page: p }));
            updateProgress(activeBook.id, clamp(p / textLoc.totalPages, 0, 1));
          }
          showToast("已跳转");
          setSheet(null);
        }

        function openBook(bookId) {
          const b = library.find((x) => x.id === bookId);
          if (!b) return;
          setActiveBookId(bookId);
          if (b.format === "PDF") {
            if (!b.meta.segmented) {
              startPdfPreprocess(bookId);
              setRoute({ name: "pdfProcessing", bookId });
              return;
            }
            preparePdfReading(bookId);
            setRoute({ name: "pdfReader", bookId });
            return;
          }
          if (b.format === "EPUB") {
            setRoute({ name: "epubReader", bookId });
            return;
          }
          setRoute({ name: "textReader", bookId });
        }

        function startPdfPreprocess(bookId) {
          setPdfJob({ running: true, progress: 0.02, bookId });
        }

        function preparePdfReading(bookId) {
          const b = library.find((x) => x.id === bookId);
          const totalSegments = b?.meta?.segmentsTotal || 0;
          setPdfLoc({
            page: 1,
            segment: 1,
            segmentsInPage: 6,
            totalSegments: totalSegments || 1240,
          });
        }

        useEffect(() => {
          if (!pdfJob.running) return;
          const id = window.setInterval(() => {
            setPdfJob((j) => {
              const next = clamp(j.progress + 0.03 + Math.random() * 0.03, 0, 1);
              return { ...j, progress: next };
            });
          }, 420);
          return () => window.clearInterval(id);
        }, [pdfJob.running]);

        useEffect(() => {
          if (!pdfJob.running) return;
          if (pdfJob.progress < 1) return;

          const bid = pdfJob.bookId;
          setPdfJob({ running: false, progress: 1, bookId: bid });
          setLibrary((prev) =>
            prev.map((b) => {
              if (b.id !== bid) return b;
              return {
                ...b,
                meta: { ...b.meta, segmented: true, segmentsTotal: 1240 },
              };
            }),
          );
          showToast("拆分完成：已生成子页序列");
          preparePdfReading(bid);
          window.setTimeout(() => {
            setRoute({ name: "pdfReader", bookId: bid });
          }, 450);
        }, [pdfJob.progress, pdfJob.running, pdfJob.bookId]);

        const filteredLibrary = useMemo(() => {
          if (filter === "all") return library;
          return library.filter((b) => b.format.toLowerCase() === filter);
        }, [library, filter]);

        function updateProgress(bookId, progress) {
          setLibrary((prev) =>
            prev.map((b) => {
              if (b.id !== bookId) return b;
              return { ...b, progress };
            }),
          );
        }

        function goBack() {
          if (route.name === "epubReader" && tocOpen) {
            setTocOpen(false);
            return;
          }
          if (route.returnTo) {
            setSheet(null);
            setTocOpen(false);
            setRoute(route.returnTo);
            return;
          }
          setSheet(null);
          setTocOpen(false);
          setRoute({ name: "shelf" });
          setActiveBookId(null);
        }

        function openSettings() {
          showHUD(false);
          setSheet("settings");
        }

        function openImport() {
          setRoute({ name: "import" });
        }

        function openTransfer() {
          setRoute({ name: "transfer" });
        }

        function importMock(kind) {

              {

        function ReadingSettingsSheet() {
          const format = activeBook?.format || "";
          const isPdf = format === "PDF";

          return (
            <Sheet
              open={sheet === "settings"}
              title="阅读设置"
              subtitle={isPdf ? "PDF 漫画：子页阅读，切段参数会影响预处理结果" : "字体与主题会即时生效"}

            >

                      fontSize: 12,
                      fontWeight: 900,
                      cursor: "pointer",
                    }}
                  >
                    {readerPrefs.keepScreenOn ? "开启" : "关闭"}
                  </button>
                </div>

                {isPdf ? (
                  <div style={{ display: "grid", gap: 14, paddingTop: 8, borderTop: "1px solid rgba(18,19,22,0.10)" }}>
                    <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                      <div style={{ fontSize: 12, fontWeight: 900, color: "rgba(18,19,22,0.78)" }}>切段参数</div>
                      <Pill label="导入后预处理" tone="accent" />
                    </div>
                    <Segmented
                      value={pdfSplitPrefs.strength}
                      options={[
                        { value: "conservative", label: "保守" },
                        { value: "standard", label: "标准" },
                        { value: "aggressive", label: "激进" },
                      ]}
                      onChange={(v) => setPdfSplitPrefs((p) => ({ ...p, strength: v }))}
                    />
                    <SliderRow
                      label="最小段高"
                      value={pdfSplitPrefs.minSegHeight}

                      max={520}
                      step={10}
                      formatValue={(v) => `${v}px`}
                      onChange={(v) => setPdfSplitPrefs((p) => ({ ...p, minSegHeight: v }))}
                    />
                    <SliderRow
                      label="段间重叠"
                      value={pdfSplitPrefs.overlapPct}
                      min={0}
                      max={6}
                      step={0.5}
                      formatValue={(v) => `${v}%`}
                      onChange={(v) => setPdfSplitPrefs((p) => ({ ...p, overlapPct: v }))}
                    />
                    <div style={{ display: "flex", gap: 10 }}>
                      <GhostButton
                        label="重算本书"
                        onClick={() => {
                          if (!activeBook) return;
                          showToast("已排队：重算拆分结果");

                          setLibrary((prev) =>
                            prev.map((b) => {
                              if (b.id !== activeBook.id) return b;
                              return { ...b, meta: { ...b.meta, segmented: false, segmentsTotal: 0 } };

                          startPdfPreprocess(activeBook.id);

                      />
                      <PrimaryButton label="完成" onClick={() => setSheet(null)} />
                    </div>
                  </div>
                ) : (
                  <div style={{ display: "flex", justifyContent: "flex-end" }}>
                    <PrimaryButton label="完成" onClick={() => setSheet(null)} />
                  </div>
                )}
              </div>
            </Sheet>
          );
        }

        function ReaderMenuSheet() {

          if (!activeBook) return null;
          const loc = getActiveLocator();
          if (!loc) return null;
          const isPdf = loc.type === "pdf";
          const isEpub = loc.type === "epub";
          const isText = loc.type === "text";
          const max = isPdf ? pdfLoc.totalSegments || 1240 : isEpub ? epubLoc.chapters : textLoc.totalPages;
          const min = 1;
          const label = isPdf ? "子页序号" : isEpub ? "章节" : "页码";

          return (
            <Sheet open={sheet === "progress"} title="进度跳转" subtitle={`${label} · ${formatLocator(loc)}`} onClose={() => setSheet(null)}>
              <div style={{ display: "grid", gap: 14 }}>
                <SliderRow
                  label={label}
                  value={progressDraft.value}
                  min={min}
                  max={max}
                  step={1}
                  formatValue={(v) => `${v}/${max}`}
                  onChange={(v) => setProgressDraft({ value: v })}
                />
                <div style={{ display: "flex", gap: 10 }}>
                  <GhostButton label="取消" onClick={() => setSheet(null)} />
                  <PrimaryButton label="跳转" onClick={() => jumpProgress()} />
                </div>
              </div>
            </Sheet>

        function TocDrawer() {
          if (!activeBook) return null;
          if (route.name !== "epubReader") return null;

          const chapters = Array.from({ length: epubLoc.chapters }, (_, i) => ({
            idx: i + 1,
            title:
              i === 0
                ? "序：一座城市的气味"
                : i === 4

                  : i === 10
                    ? "第十一章：夜航"
                    : `第 ${i + 1} 章`,

          return (
            <div
              style={{
                position: "absolute",

        function PdfReaderScreen() {
          const b = activeBook;
          const ink = isDark ? "rgba(255,255,255,0.92)" : "rgba(18,19,22,0.92)";
          const muted = isDark ? "rgba(255,255,255,0.56)" : "rgba(18,19,22,0.56)";

          const pageSegments = pdfLoc.segmentsInPage;
          const globalIndex = (pdfLoc.page - 1) * pageSegments + pdfLoc.segment;

          function nextSegment() {
            flashHint(`G#${globalIndex + 1}`);
            setPdfLoc((p) => {
              const next = { ...p };
              if (p.segment < p.segmentsInPage) {
                next.segment += 1;
              } else {
                next.page += 1;
                next.segment = 1;
                next.segmentsInPage = 4 + ((next.page * 3) % 4);
              }
              return next;
            });
            if (b) updateProgress(b.id, clamp((globalIndex + 1) / (pdfLoc.totalSegments || 1240), 0, 1));
          }

          function prevSegment() {
            flashHint(`G#${Math.max(1, globalIndex - 1)}`);
            setPdfLoc((p) => {
              const next = { ...p };
              if (p.segment > 1) {
                next.segment -= 1;
              } else {
                next.page = Math.max(1, p.page - 1);
                next.segmentsInPage = 4 + ((next.page * 3) % 4);
                next.segment = next.segmentsInPage;
              }
              return next;
            });
            if (b) updateProgress(b.id, clamp((globalIndex - 1) / (pdfLoc.totalSegments || 1240), 0, 1));
          }

          return (

                </div>

                {query.trim() && results.length === 0 ? (
                  <div style={{ fontSize: 12, fontWeight: 650, color: "rgba(18,19,22,0.62)" }}>未找到匹配结果（原型）</div>
                ) : null}

                <div style={{ display: "grid", gap: 10 }}>
                  {results.map((r, idx) => (
                    <button
                      key={idx}
                      onClick={() => {
                        showToast(`跳转：${r.loc}`);
                        setRoute(route.returnTo || { name: "shelf" });
                      }}
                      style={{ border: "none", background: "transparent", padding: 0, cursor: "pointer", textAlign: "left" }}
                    >
                      <div
                        style={{
                          background: "rgba(255,255,255,0.78)",
                          border: "1px solid rgba(18,19,22,0.10)",
                          borderRadius: 18,
                          padding: 14,
                          display: "grid",
                          gap: 8,
                        }}
                      >
                        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "center" }}>
                          <div style={{ fontSize: 12, fontWeight: 900, color: "rgba(18,19,22,0.62)" }}>{r.loc}</div>
                          <Pill label="结果" tone="neutral" />
                        </div>
                        <div style={{ fontSize: 13, fontWeight: 750, color: "rgba(18,19,22,0.86)", lineHeight: 1.55 }}>{r.snippet}</div>
                      </div>
                    </button>
                  ))}
                </div>
              </div>
            </div>
          );
        }

        function ScreenRouter() {
          if (route.name === "import") return <ImportScreen />;
          if (route.name === "transfer") return <TransferScreen />;
          if (route.name === "pdfProcessing") return <PdfProcessingScreen />;
          if (route.name === "pdfReader") return <PdfReaderScreen />;
          if (route.name === "epubReader") return <EpubReaderScreen />;
          if (route.name === "textReader") return <TextReaderScreen />;
          if (route.name === "bookmarks") return <BookmarksScreen />;
          if (route.name === "annotations") return <AnnotationsScreen />;
          if (route.name === "search") return <SearchScreen />;
          return <ShelfScreen />;
        }

        useEffect(() => {
          if (route.name === "pdfProcessing") {
            const bid = route.bookId;
            if (!bid) return;
            setActiveBookId(bid);
          }
          if (route.name === "pdfReader") {
            const bid = route.bookId;
            if (!bid) return;
            setActiveBookId(bid);
          }
          if (route.name === "epubReader" || route.name === "textReader" || route.name === "bookmarks" || route.name === "annotations" || route.name === "search") {
            const bid = route.bookId;
            if (!bid) return;
            setActiveBookId(bid);
          }
        }, [route.name, route.bookId]);

        useEffect(() => {
          if (route.name === "pdfReader" || route.name === "epubReader" || route.name === "textReader") {
            hideHUD();
          }
        }, [route.name, route.bookId]);

        return (
          <div style={{ display: "grid", justifyItems: "center", gap: 18 }}>
            <div style={{ display: "grid", justifyItems: "center", gap: 10 }}>
              <div style={{ fontFamily: '"Noto Serif SC", serif', fontSize: 16, fontWeight: 700, color: "rgba(18,19,22,0.78)" }}>
                安卓阅读器 · 原型
              </div>
              <div style={{ fontSize: 12, fontWeight: 650, color: "rgba(18,19,22,0.58)", textAlign: "center", lineHeight: 1.35 }}>
                点击书籍进入阅读；PDF 漫画会先预处理并生成子页序列
              </div>
            </div>

            <AndroidFrame time={time} battery={88} darkMode={false}>
              <div style={{ height: "100%", position: "relative", background: isDark ? "#0d0e10" : "var(--paper)" }}>
                <ScreenRouter />
                <div
                  style={{
                    position: "absolute",
                    inset: 0,
                    background: "rgba(0,0,0,1)",
                    opacity: clamp(1 - readerPrefs.brightness, 0, 0.75),
                    pointerEvents: "none",
                    zIndex: 45,
                  }}
                />
                <HintPill show={!!pageHint} text={pageHint || ""} dark={isDark} />
                <TocDrawer />
                <ReadingSettingsSheet />
                <ReaderMenuSheet />
                <HighlightSheet />
                <ProgressSheet />
                <BottomToast show={!!toast} text={toast || ""} />
              </div>
            </AndroidFrame>
          </div>
        );
      }

      const root = ReactDOM.createRoot(document.getElementById("root"));
      root.render(<App />);
    </script>
  </body>
</html>
